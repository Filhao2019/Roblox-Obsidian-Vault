name: Vault integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Regression tests
        run: python -m unittest discover -s _tools -p test_vault.py
      - name: Note links, metadata, embeds and media checksums
        run: python _tools/vault.py check
      - name: Plugins match notes
        run: python _tools/build_plugins.py && git add -A .plugins .claude-plugin && git diff --cached --exit-code --stat
